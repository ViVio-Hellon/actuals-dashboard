<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="{{TOKEN}}">
<title>{{NAME}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b6d86'/%3E%3Crect x='3' y='8' width='2' height='5' fill='white'/%3E%3Crect x='7' y='5' width='2' height='8' fill='white'/%3E%3Crect x='11' y='3' width='2' height='10' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/tokens.actuals.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/actuals.css">
</head>
<body>
<!--
  外枠は python-web-tools（base.html）と同じ: 上の帯（いま何を見ているか）／左のレール（画面）／本体。
  業務の判断はサーバが持ち、ここは描くだけ。
-->
<div class="offline" id="offline" hidden role="alert">
  <span id="offlineText">ツールに接続できません。Start.vbs をもう一度起動してください（起動し直すと自動でつながります）。</span>
  <button class="btn" type="button" id="reconnect">再接続</button>
</div>
<div class="busyband" id="staleband" hidden role="status">
  <span class="busyband__lines" id="staletext"></span>
</div>
<div class="busyband" id="busyband" hidden role="status" aria-live="polite">
  <span class="busyband__spin" aria-hidden="true"></span>
  <span class="busyband__lines" id="busylines"></span>
</div>

<header class="ribbon">
  <div class="brand">
    <b class="brand__name">{{NAME}}</b>
    <span class="ver" title="このツールの版">v{{VERSION}}</span>
  </div>
  <div class="ribbon__slots">
    <div class="slot"><span class="k">集計月</span><span class="v" id="rb-month">—</span></div>
    <div class="slot"><span class="k">暦</span><span class="v" id="rb-cal">—</span></div>
    <div class="slot"><span class="k">取り込み</span><span class="v" id="rb-data">—</span></div>
    <div class="slot" id="rb-shared-slot"><span class="k">共有</span><span class="v" id="rb-shared">—</span></div>
  </div>
  <div class="running" id="rb-running" hidden>
    <span class="running__dot" aria-hidden="true"></span>
    <span class="running__text"><b id="rb-run-what">データ更新中</b><small id="rb-run-how"></small></span>
  </div>
  <div class="ribbon__end">
    <button class="btn" type="button" id="rneRun" title="RNEConverter に倉入実績の抽出を頼み、終わったら取り込みます">
      <span class="gl" aria-hidden="true">⟳</span>データ更新</button>
    <button class="btn" type="button" id="themeToggle" title="画面の色をライト / ダークで切り替えます（この端末に残ります）">
      <span class="gl" aria-hidden="true">◐</span>表示</button>
    <button class="btn btn--danger" type="button" id="quit"><span class="gl">■</span>終了</button>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="画面">
    <ol id="rail">
      <li><a href="#month" data-view="month"><span class="n">1</span><span class="rail__text"><b>月の集計</b><small>グループ×日・直別グラフ</small></span></a></li>
      <li><a href="#year" data-view="year"><span class="n">2</span><span class="rail__text"><b>年の集計</b><small>年度の日別・月別</small></span></a></li>
      <li><a href="#review" data-view="review"><span class="n">3</span><span class="rail__text"><b>振り分け確認</b><small>未分類・手動訂正</small></span><span class="badge badge--todo" id="badge-review" hidden></span></a></li>
      <li><a href="#master" data-view="master"><span class="n">4</span><span class="rail__text"><b>条件表</b><small>グループの条件（旧 設定）</small></span></a></li>
      <li><a href="#data" data-view="data"><span class="n">5</span><span class="rail__text"><b>データ</b><small>取り込み・蓄積の状況</small></span><span class="badge badge--todo" id="badge-data" hidden></span></a></li>
      <li><a href="#settings" data-view="settings"><span class="n">6</span><span class="rail__text"><b>設定</b><small>置き場所・ログ</small></span></a></li>
    </ol>
  </nav>
  <main class="work" id="main"></main>
</div>

<aside class="drawer" id="drawer" hidden aria-label="ロットの詳細">
  <header class="drawer__head">
    <h3 id="drawerTitle"></h3>
    <button class="btn btn--sm" type="button" id="drawerClose">閉じる</button>
  </header>
  <div class="drawer__body" id="drawerBody"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
